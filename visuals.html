<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visuals — Karthik B</title>
<meta name="description" content="Screens, components and the little interactions in between, by Karthik B.">
<link rel="preload" href="assets/fonts/inter-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Inter Variable (rsms/inter 4, SIL OFL 1.1, see assets/fonts/Inter-LICENSE.txt) */
@font-face{font-family:'Inter Variable';font-style:normal;font-display:swap;font-weight:100 900;src:url(assets/fonts/inter-latin-ext-opsz-normal.woff2) format('woff2-variations'),url(assets/fonts/inter-latin-ext-opsz-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Inter Variable';font-style:normal;font-display:swap;font-weight:100 900;src:url(assets/fonts/inter-latin-opsz-normal.woff2) format('woff2-variations'),url(assets/fonts/inter-latin-opsz-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#fcfcfc;
  --ink:#1f1f1f;
  --blue:#0d41ff;
  --card:rgba(217,217,217,.2);
  --sans:"Inter Variable","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cw:300px;
  --gap:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:400 16px/24px var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
a{color:inherit}
.corner{position:fixed;left:0;top:0;width:20px;height:20px;background:#f9f9f9;border-right:.8px solid rgba(0,0,0,.04);border-bottom:.8px solid rgba(0,0,0,.04);display:grid;place-items:center;z-index:5}
.corner i{width:7px;height:7px;border:.8px solid rgba(0,0,0,.08);border-radius:1px;opacity:.3}
.where{position:absolute;left:calc(83.33% - 47px);top:40px;display:flex;gap:4px;font-size:13px;line-height:20px;color:#575757;white-space:nowrap}
.where .place{margin-right:3px}

.wrap{position:relative;width:var(--w,1236px);margin:0 auto;padding:150px 0 160px}
.head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.head h1{font-size:16px;line-height:24px;font-weight:500}
.head p{font-size:13px;line-height:24px;color:rgba(0,0,0,.49)}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:16px 0}
.pill{display:inline-flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:#efefef;font:400 16px/24px var(--sans);color:rgba(31,31,31,.6);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color .15s ease-out,color .15s ease-out}
.pill:hover{color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--blue);color:#fff;font-weight:500}
.pill:focus{outline:none}.pill:focus-visible{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--blue)}
.pill:active{transform:scale(.97)}

/* masonry: fixed 300px columns, variable card heights */
.grid{display:flex;gap:var(--gap);align-items:flex-start}
.col{display:flex;flex-direction:column;gap:var(--gap);width:var(--cw);flex:none}
.card{position:relative;width:var(--cw);height:var(--h);border-radius:16px;background:var(--card);overflow:hidden;animation:cardIn .35s cubic-bezier(.2,.8,.2,1) both}
.card img{display:block;width:100%;height:100%;object-fit:cover}
.store{display:none}
@keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* bottom navigation (Figma: Nav - Main navigation) */
.nav{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;background:rgba(252,252,251,.68);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);box-shadow:0 0 0 1px #e2e1df,0 8px 30px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(255,255,255,.06)}
.nav-b{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:999px;border:0;background:transparent;color:inherit;cursor:pointer;transition:background-color .15s ease-out}
.nav-b:hover,.nav-b:focus-visible{background:rgba(30,29,27,.05)}
.nav-b:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.nav-b:active img{transform:scale(.92)}
.nav-b img{display:block;transition:transform .15s ease-out}
.nav-sep{width:1px;height:18px;margin:0 2px;background:rgba(30,29,27,.16)}
.tip{position:absolute;left:50%;bottom:54.7px;transform:translate(-50%,4px);display:flex;align-items:center;gap:5.7px;padding:3.8px 5.7px 3.8px 7.6px;border-radius:6px;background:#f7f7f6;box-shadow:0 0 0 1px #e2e1df,0 4px 8px rgba(0,0,0,.04),0 1px 1px rgba(0,0,0,.02);font:400 13.3px/19.95px "Geist",var(--sans);color:#1e1d1b;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s ease-out,transform .15s ease-out}
.nav-b:hover .tip,.nav-b:focus-visible .tip{opacity:1;transform:translate(-50%,0)}
.tip kbd{display:inline-grid;place-items:center;min-width:16.25px;height:17.1px;padding:0 4.75px;border-radius:4px;background:#e2e1df;border:1px solid rgba(30,29,27,.18);font:500 10.5px/1 "Geist",var(--sans);color:#767472}
.tip span{display:flex;gap:2.85px}
@media (hover:none){.tip{display:none}}

@media (max-width:640px){
  .where{left:20px;right:auto}
  .wrap{padding-top:103px}
  .head{gap:2px 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="corner" aria-hidden="true"><i></i></div>
<p class="where"><span class="place">Tamilnadu, India</span><span>IST</span><span id="time">--:--</span></p>
<main class="wrap" id="wrap">
  <header class="head">
    <h1>Visuals</h1>
    <p>Screens, components and the little interactions in between.</p>
  </header>
  <div class="filters" role="group" aria-label="Filter visuals">
    <button class="pill" type="button" data-f="all" aria-pressed="true">All</button>
    <button class="pill" type="button" data-f="mobile" aria-pressed="false">Mobile</button>
    <button class="pill" type="button" data-f="product" aria-pressed="false">Product</button>
    <button class="pill" type="button" data-f="saas" aria-pressed="false">SaaS</button>
    <button class="pill" type="button" data-f="interactions" aria-pressed="false">Interactions</button>
  </div>
  <div class="grid" id="grid" aria-live="polite"></div>
  <div class="store" id="store">
    <figure class="card" data-cat="mobile product" style="--h:300px"><img src="assets/work/dailyloop-1000.webp" srcset="assets/work/dailyloop-1000.webp 1000w, assets/work/dailyloop-2000.webp 2000w" sizes="300px" width="1000" height="1000" alt="DailyLoop habit tracker app: a welcome screen and a daily to-do list screen" decoding="async"></figure>
  </div>
</main>
<nav class="nav" aria-label="Main navigation">
  <a class="nav-b" href="visuals.html" aria-label="Photos (G then P)"><img src="assets/figma/nav-photos.svg" width="16" height="14.75" alt=""><span class="tip" aria-hidden="true">Photos<span><kbd>G</kbd><kbd>P</kbd></span></span></a>
  <a class="nav-b" href="mailto:kartiedesigner@gmail.com?subject=AMA" aria-label="AMA, ask me anything (G then A)"><img src="assets/figma/nav-ama.svg" width="15" height="15" alt=""><span class="tip" aria-hidden="true">AMA<span><kbd>G</kbd><kbd>A</kbd></span></span></a>
  <span class="nav-sep" aria-hidden="true"></span>
  <button class="nav-b" type="button" aria-label="Preferences"><img src="assets/figma/nav-prefs.svg" width="16" height="13.5" alt=""><span class="tip" aria-hidden="true">Preferences</span></button>
</nav>
<script>
(() => {
  const t = document.getElementById('time');
  const fmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: false });
  const tick = () => { t.textContent = fmt.format(new Date()); };
  tick(); setInterval(tick, 30000);
  // keyboard: G then P opens Photos, G then A opens AMA
  let gAt = 0;
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea|select/i.test(e.target.tagName)) return;
    const k = e.key.toLowerCase();
    if (k === 'g') { gAt = Date.now(); return; }
    if (Date.now() - gAt > 1200) return;
    gAt = 0;
    if (k === 'p') location.href = 'visuals.html';
    else if (k === 'a') location.href = 'mailto:kartiedesigner@gmail.com?subject=AMA';
  });


  // placeholder cards until real work is added: fixed 300px width, varied heights
  const store = document.getElementById('store');
  const H = [380, 240, 340, 300, 420, 260, 360, 300, 240, 400, 320, 280, 380, 260, 340, 300, 420, 240, 360];
  const CATS = ['mobile', 'product', 'saas', 'interactions'];
  H.forEach((h, i) => {
    const c = document.createElement('div');
    c.className = 'card'; c.style.setProperty('--h', h + 'px');
    c.dataset.cat = CATS[i % CATS.length];
    c.setAttribute('aria-hidden', 'true');
    store.appendChild(c);
  });
  const cards = [...store.children];
  const grid = document.getElementById('grid'), wrap = document.getElementById('wrap');
  let filter = 'all', cols = 0;
  const layout = force => {
    const cw = 300, gap = 12;
    const vw = Math.min(innerWidth, document.documentElement.clientWidth, window.visualViewport ? visualViewport.width : innerWidth);
    const n = Math.max(1, Math.min(4, Math.floor((vw - 40 + gap) / (cw + gap))));
    if (n === cols && !force) return;
    cols = n;
    wrap.style.setProperty('--w', (n * cw + (n - 1) * gap) + 'px');
    const columns = Array.from({ length: n }, () => { const d = document.createElement('div'); d.className = 'col'; return d; });
    const heights = new Array(n).fill(0);
    cards.forEach(c => store.appendChild(c));
    cards.filter(c => filter === 'all' || c.dataset.cat.split(' ').includes(filter)).forEach(c => {
      const k = heights.indexOf(Math.min(...heights));
      columns[k].appendChild(c);
      heights[k] += parseInt(c.style.getPropertyValue('--h')) + gap;
    });
    grid.replaceChildren(...columns);
  };
  document.querySelectorAll('.pill').forEach(p => p.addEventListener('click', () => {
    filter = p.dataset.f;
    document.querySelectorAll('.pill').forEach(b => b.setAttribute('aria-pressed', b === p));
    layout(true);
  }));
  addEventListener('resize', () => layout(false));
  layout(true);
})();
</script>
</body>
</html>

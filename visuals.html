<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visuals — Karthik B</title>
<meta name="description" content="Screens, UI components and interactions by Karthik B, product designer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Geist+Mono:wght@400;500&family=Caveat:wght@500;700&family=VT323&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --hand:"Caveat","Comic Sans MS",cursive;
  --serif:"Instrument Serif",Georgia,serif;
  --accent:#ff4b3e;
  --blue:#0d99ff;
  --hero-weight:500;--trk:-.035em;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
html[data-theme="dark"]{
  --bg:#0a0a0a;--bg-2:#121213;--card:#141415;--panel:rgba(22,22,24,.9);
  --fg:#ededed;--muted:rgba(237,237,237,.64);--dim:rgba(237,237,237,.42);
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.16);
  --dither:255,255,255;--dither-a:.2;--shadow:0 12px 32px rgba(0,0,0,.5);
  --ruler-bg:#101011;--ruler-fg:rgba(255,255,255,.38);
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#f6f6f3;--bg-2:#ececE8;--card:#ffffff;--panel:rgba(255,255,255,.92);
  --fg:#151515;--muted:rgba(21,21,21,.66);--dim:rgba(21,21,21,.45);
  --line:rgba(0,0,0,.08);--line-2:rgba(0,0,0,.16);
  --dither:20,20,20;--dither-a:.17;--shadow:0 12px 32px rgba(0,0,0,.1);
  --ruler-bg:#efefeb;--ruler-fg:rgba(0,0,0,.42);
  color-scheme:light;
}
html[data-theme="blueprint"]{
  --bg:#0d3b8c;--bg-2:#0f4499;--card:#114aa6;--panel:rgba(15,68,153,.94);
  --fg:#f2f6ff;--muted:rgba(242,246,255,.78);--dim:rgba(242,246,255,.55);
  --line:rgba(255,255,255,.2);--line-2:rgba(255,255,255,.38);
  --dither:255,255,255;--dither-a:.22;--shadow:0 12px 32px rgba(0,0,20,.35);
  --ruler-bg:#0b3479;--ruler-fg:rgba(255,255,255,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;padding:20px 0 0 20px;transition:background-color .35s,color .35s;
  overflow-x:hidden;
}
html[data-theme="blueprint"] body{
  background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:24px 24px;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:4px}
[id]{scroll-margin-top:84px}
::selection{background:var(--accent);color:#fff}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.dim{color:var(--dim)}.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Rulers */
.ruler{position:fixed;z-index:80;background:var(--ruler-bg);pointer-events:none}
.ruler-x{top:0;left:20px;right:0;height:20px;border-bottom:1px solid var(--line)}
.ruler-y{top:20px;left:0;bottom:0;width:20px;border-right:1px solid var(--line)}
.ruler-c{top:0;left:0;width:20px;height:20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;place-items:center}
.ruler-c i{width:7px;height:7px;border:1px solid var(--ruler-fg);border-radius:1px}
.ruler canvas{display:block;width:100%;height:100%}

/* Page frame */
.page{max-width:1120px;margin:0 auto;padding:0 32px;position:relative;border-left:1px solid var(--line);border-right:1px solid var(--line)}

/* Nav */
nav.top{position:sticky;top:20px;z-index:50;background:var(--bg);margin:0 -32px;padding:14px 32px;border-bottom:1px solid transparent;transition:border-color .2s,background-color .35s}
nav.top.scrolled{border-bottom-color:var(--line)}
.nav-in{display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:8px;font-weight:500;font-size:15px}
.logo-mark{display:grid;grid-template-columns:repeat(3,5px);grid-auto-rows:5px;gap:1px}
.logo-mark i{background:var(--fg);border-radius:1px}
.logo-mark i.o{background:transparent}
.nav-links{display:flex;gap:2px;margin-left:12px}
.nav-links a{padding:8px 10px;border-radius:8px;color:var(--muted);transition:color .15s,background-color .15s}
.nav-links a:hover{color:var(--fg);background:var(--bg-2)}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);transition:color .15s,border-color .15s,transform .15s}
.icon-btn:hover{color:var(--fg);border-color:var(--line-2)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:16px;height:16px}
.th-ic-l{display:none}
html[data-theme="light"] .th-ic-d{display:none}
html[data-theme="light"] .th-ic-l{display:block}

/* Location chip */
.loc{position:relative;display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted);padding:6px 8px;border-radius:8px;cursor:default}
.loc .u{border-bottom:1px dashed var(--line-2);padding-bottom:1px}
.loc svg{width:14px;height:14px;flex:none}
.tip{position:absolute;top:calc(100% + 10px);right:0;background:#111;color:#f5f5f5;border:1px solid rgba(255,255,255,.12);padding:10px 14px;border-radius:10px;font-family:var(--mono);font-size:12px;line-height:1.6;white-space:nowrap;opacity:0;transform:translateY(-4px);transition:opacity .18s,transform .18s;pointer-events:none;text-align:center;z-index:5;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.tip b{font-weight:500;color:#fff}
.tip .s{color:rgba(255,255,255,.5)}
.loc:hover .tip,.loc:focus-visible .tip{opacity:1;transform:none}

/* Sections */
.sec{position:relative;padding:104px 0;border-top:1px solid var(--line)}
.sec::before,.sec::after{content:"+";position:absolute;top:0;font-family:var(--mono);font-size:14px;line-height:1;color:var(--dim);transform:translate(-50%,-55%);background:var(--bg);padding:2px 0}
.sec::before{left:-32px}
.sec::after{left:calc(100% + 32px)}
.sheet{display:flex;align-items:center;gap:10px;margin-bottom:22px;color:var(--dim)}
.sheet .no{border:1px solid var(--line-2);padding:2px 6px;border-radius:2px}
.sheet .hatch{width:14px;height:14px;border:1px solid var(--line-2);background:repeating-linear-gradient(45deg,var(--dim) 0 1px,transparent 1px 4px)}
.h2{font-size:clamp(28px,4vw,40px);font-weight:500;letter-spacing:-.025em;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);margin-top:10px;max-width:52ch}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:44px;flex-wrap:wrap}
.kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;font-family:var(--mono);font-size:11px;color:var(--fg)}

/* Hero */
.hero{position:relative;padding:112px 0 112px}
.hero-dither{position:absolute;top:0;bottom:0;left:-32px;width:calc(100% + 64px);height:100%;-webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent 100%);mask-image:linear-gradient(to bottom,#000 55%,transparent 100%);pointer-events:none;opacity:.3}
.hero-meta{position:absolute;left:0;right:0;top:24px;display:flex;justify-content:space-between;color:var(--dim)}
.hero-in{position:relative;z-index:1;text-align:left}
.hero-in .avatar-wrap{margin:0 0 32px}
.h1wrap{position:relative;display:block}
.big{font-size:clamp(34px,4.4vw,52px);line-height:1.1;font-weight:var(--hero-weight);font-variation-settings:"wght" var(--hero-weight);letter-spacing:var(--trk);text-wrap:balance;color:var(--fg);margin:0}
.fw{transition:color .3s}
.wv span:not(.bal){display:inline-block}
.fw.swap{animation:chIn .45s var(--ease-out)}
.lead{font-size:clamp(19px,2vw,24px);line-height:1.85;color:var(--muted);max-width:32em;margin:16px 0 0;text-wrap:pretty}
.chip{display:inline-flex;align-items:center;gap:.32em;padding:.06em .5em .06em .22em;margin:0 .06em;border-radius:.55em;background:var(--chip);color:var(--fg);font:inherit;line-height:1.3;vertical-align:baseline;white-space:nowrap;overflow:hidden;transition:width .45s var(--ease-out),background-color .2s,transform .15s}
.chip:hover{background:var(--chip-h)}
.chip:active{transform:scale(.96)}
.ci{width:1.15em;height:1.15em;display:inline-grid;flex:none}
.ci svg{width:100%;height:100%;display:block}
.ci.pop{animation:ciIn .55s var(--spring)}
.ct span{display:inline-block;animation:chIn .42s var(--ease-out) backwards;animation-delay:calc(var(--i) * 22ms)}
@keyframes ciIn{from{transform:scale(.3) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
@keyframes chIn{from{opacity:0;filter:blur(6px);transform:translateY(.25em)}to{opacity:1;filter:none;transform:none}}
.hero-in .hero-cta{justify-content:flex-start;margin-top:36px}
.nb{white-space:nowrap}
/* Customizable phrase (Figma-style selection + text toolbar) */
.sel{position:relative;display:inline-block;padding:0 .35em;margin:0 .12em;outline:1.5px solid var(--blue);cursor:pointer;color:var(--fg);line-height:1.3;vertical-align:baseline;white-space:nowrap}
.sel:focus-visible{outline-width:2.5px}
.sel .hd{position:absolute;width:9px;height:9px;background:var(--bg);border:1.5px solid var(--blue);pointer-events:none}
.sel .hd:nth-child(1){left:-5px;top:-5px}.sel .hd:nth-child(2){right:-5px;top:-5px}.sel .hd:nth-child(3){left:-5px;bottom:-5px}.sel .hd:nth-child(4){right:-5px;bottom:-5px}
.sel-t{transition-property:color;transition-duration:.15s;transition-timing-function:ease-out}
.ftb{position:absolute;left:50%;top:calc(100% + 14px);transform:translate(-50%,-4px);display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--card);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);font:400 15px/1 var(--sans);font-style:normal;color:var(--fg);opacity:0;pointer-events:none;transition-property:opacity,transform;transition-duration:.15s;transition-timing-function:ease-out;z-index:20;cursor:default;text-align:left}
.sel.open .ftb{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.ftb-dd{position:relative;display:inline-flex}
.ftb-b{position:relative;height:34px;min-width:34px;padding:0 10px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--fg);transition-property:background-color,transform;transition-duration:.15s;transition-timing-function:ease-out}
.ftb-b::before{content:"";position:absolute;inset:-3px}
.ftb-b:hover,.ftb-b[aria-pressed="true"],.ftb-b[aria-expanded="true"]{background:var(--bg-2)}
.ftb-b:active{transform:scale(.96)}
.ftb-b svg{width:12px;height:12px;color:var(--dim)}
.ftb-font{min-width:120px;justify-content:space-between;font-size:17px}
.ftb-sep{width:1px;height:20px;background:var(--line-2);margin:0 4px}
.ftb-dot{width:18px;height:18px;border-radius:50%;background:var(--c);box-shadow:inset 0 -2px 4px rgba(0,0,0,.25),0 0 0 1px var(--line-2)}
.ftb-menu{position:absolute;top:calc(100% + 8px);left:0;min-width:180px;padding:4px;background:var(--card);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);display:none;z-index:2}
.ftb-menu.open{display:block}
.ftb-menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;height:36px;padding:0 10px;border-radius:8px;font-size:17px;text-align:left;color:var(--fg);transition-property:background-color;transition-duration:.15s;transition-timing-function:ease-out}
.ftb-menu button:hover,.ftb-menu button:focus-visible{background:var(--bg-2)}
.ftb-menu button[aria-checked="true"]::after{content:"✓";font-family:var(--sans);font-size:13px;color:var(--muted)}
.ftb-colors.open{display:grid;grid-template-columns:repeat(3,auto);gap:4px;min-width:0;right:0;left:auto}
.ftb-colors button{width:36px;height:36px;padding:0;justify-content:center}
.ftb-colors button[aria-checked="true"]::after{display:none}
.ftb-colors button[aria-checked="true"] .ftb-dot{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--fg)}
html[data-theme="dark"]{--chip:rgba(255,255,255,.08);--chip-h:rgba(255,255,255,.13);--dk-bg:rgba(26,26,28,.6);--dk-line:rgba(255,255,255,.1);--dk-fill:rgba(255,255,255,.1);--dk-shadow:0 14px 34px rgba(0,0,0,.45);--f1:#f5e050;--f2:#22d3ee;--f3:#e879f9}
html[data-theme="light"]{--chip:rgba(0,0,0,.055);--chip-h:rgba(0,0,0,.09);--dk-bg:rgba(255,255,255,.62);--dk-line:rgba(0,0,0,.08);--dk-fill:rgba(0,0,0,.06);--dk-shadow:0 14px 34px rgba(0,0,0,.12);--f1:#c2410c;--f2:#0e7490;--f3:#a21caf}
html[data-theme="blueprint"]{--chip:rgba(255,255,255,.12);--chip-h:rgba(255,255,255,.18);--dk-bg:rgba(13,59,140,.6);--dk-line:rgba(255,255,255,.25);--dk-fill:rgba(255,255,255,.14);--dk-shadow:0 14px 34px rgba(0,0,30,.35);--f1:#ffe066;--f2:#7ee8fa;--f3:#ffb3f5}


sup{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:2px;letter-spacing:0}

.avatar-wrap{position:relative;width:84px;height:84px;margin-bottom:30px;cursor:grab;touch-action:none;user-select:none;transform-origin:center;will-change:transform}
.avatar-wrap:active{cursor:grabbing}
.avatar{width:100%;height:100%;border-radius:12px;overflow:hidden;border:1px solid var(--line-2);background:var(--bg-2);position:relative}
.avatar{background:#000}
.avatar img{position:absolute;width:220%;height:220%;max-width:none;left:-68%;top:-54%;display:block;pointer-events:none;user-select:none}
.hat{position:absolute;left:-8px;top:-36px;width:100px;opacity:0;transform:translateY(-70px) rotate(-14deg);transition:transform .7s var(--spring),opacity .25s;pointer-events:none}
.has-hat .hat{opacity:1;transform:translateY(0) rotate(-8deg)}
.avatar-hint{position:absolute;left:100px;top:26px;font-family:var(--hand);font-size:20px;color:var(--dim);white-space:nowrap;transform:rotate(-3deg);transition:opacity .3s}
.avatar-hint svg{width:34px;height:20px;vertical-align:middle;transform:scaleX(-1)}


.hero-cta{display:flex;align-items:center;gap:12px;margin-top:36px;flex-wrap:wrap;position:relative}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-size:15px;font-weight:500;transition:transform .15s,background-color .2s,border-color .2s,color .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--fg);color:var(--bg)}
.btn-p:hover{opacity:.9}
.btn-g{border:1px solid var(--line-2);color:var(--fg)}
.btn-g:hover{border-color:var(--dim)}
.status{display:inline-flex;align-items:center;gap:8px;color:var(--muted);margin-left:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.5)}70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}


/* Work */
.work-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px 28px}
.proj{cursor:pointer;display:block;text-align:left;width:100%}
.flabel{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--dim);font-family:var(--mono);font-size:11px}
.flabel .nmx{transition:color .15s}
.flabel .dims{color:var(--blue);opacity:0;transition:opacity .15s}
.proj:hover .flabel .nmx,.proj:focus-visible .flabel .nmx{color:var(--blue)}
.proj:hover .dims,.proj:focus-visible .dims{opacity:1}
.cover{position:relative;aspect-ratio:4/3;border:1px solid var(--line);border-radius:4px;background:var(--bg-2);overflow:visible}
.cover-in{position:absolute;inset:0;overflow:hidden;border-radius:4px}
.cover canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ring{position:absolute;inset:-1px;border:1.5px solid var(--blue);border-radius:4px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:3}
.ring i{position:absolute;width:8px;height:8px;background:#fff;border:1.5px solid var(--blue)}
.ring i:nth-child(1){left:-5px;top:-5px}.ring i:nth-child(2){right:-5px;top:-5px}.ring i:nth-child(3){left:-5px;bottom:-5px}.ring i:nth-child(4){right:-5px;bottom:-5px}
.proj:hover .ring,.proj:focus-visible .ring{opacity:1}
.mock-wrap{position:absolute;inset:0;display:grid;place-items:center;transition:transform .5s var(--ease-out)}
.proj:hover .mock-wrap{transform:translateY(-6px) scale(1.02)}
.pmeta{display:grid;grid-template-columns:1fr auto;gap:4px 16px;margin-top:16px;align-items:baseline}
.pmeta h3{font-size:19px;font-weight:500;letter-spacing:-.01em}
.pmeta p{grid-column:1/-1;color:var(--muted);font-size:15px;max-width:46ch}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;grid-column:1/-1}
.tag{border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.view{color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;transition:color .15s}
.proj:hover .view{color:var(--fg)}

/* Mock UI */
.phone{height:84%;width:auto;aspect-ratio:9/18.5;border-radius:26px;background:var(--card);border:1px solid var(--line-2);box-shadow:var(--shadow);padding:12px 10px;display:flex;flex-direction:column;gap:7px;font-size:10px;line-height:1.3;overflow:hidden}
.isl{width:38%;height:11px;border-radius:8px;background:var(--fg);opacity:.9;margin:0 auto 4px;flex:none}
.ph-top{display:flex;align-items:center;gap:6px;font-weight:500;font-size:11px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.av{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--pc);color:#06210f;flex:none}
.av svg{width:12px;height:12px}
.bub{padding:6px 8px;border-radius:10px;max-width:82%;background:var(--bg-2);color:var(--fg)}
.bub.me{align-self:flex-end;background:var(--pc);color:#04140a}
.wave{margin-top:auto;display:flex;align-items:center;gap:2px;height:26px;padding:0 4px}
.wave i{flex:1;background:var(--pc);border-radius:2px;opacity:.8}
.mic{width:30px;height:30px;border-radius:50%;background:var(--fg);margin:4px auto 0;flex:none;display:grid;place-items:center;color:var(--bg)}
.mic svg{width:12px;height:12px}
.ring-t{width:62%;aspect-ratio:1;border-radius:50%;margin:12px auto 6px;background:conic-gradient(var(--pc) 0 72%,var(--line-2) 72% 100%);display:grid;place-items:center;flex:none}
.ring-t>div{width:84%;aspect-ratio:1;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.ring-t b{font-size:20px;font-weight:500;letter-spacing:-.02em;display:block}
.pill-b{margin-top:auto;border-radius:10px;padding:8px;text-align:center;background:var(--fg);color:var(--bg);font-weight:500}
.win{width:80%;aspect-ratio:16/10.5;border-radius:10px;background:var(--card);border:1px solid var(--line-2);box-shadow:var(--shadow);display:grid;grid-template-columns:20% 1fr;overflow:hidden;font-size:9.5px;line-height:1.3}
.win-side{border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:7px}
.win-main{padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.bar{height:6px;border-radius:3px;background:var(--line-2)}
.bar.a{background:var(--pc)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kpi{border:1px solid var(--line);border-radius:6px;padding:6px}
.kpi b{display:block;font-size:13px;font-weight:500;margin-top:2px}
.trow{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;padding:5px 0;border-top:1px solid var(--line);color:var(--muted)}
.agent{width:78%;border-radius:12px;background:var(--card);border:1px solid var(--line-2);box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:8px;font-size:10.5px;line-height:1.35}
.ask{align-self:flex-end;background:var(--bg-2);border-radius:10px;padding:6px 9px}
.step{display:flex;align-items:center;gap:7px;color:var(--muted)}
.step .ck{width:14px;height:14px;border-radius:50%;background:var(--pc);display:grid;place-items:center;color:#140a26;flex:none}
.step .ck svg{width:9px;height:9px}
.step .sp{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--pc);animation:spin 1s linear infinite;flex:none}
.step.on{color:var(--fg)}
.tools{display:flex;gap:5px;flex-wrap:wrap}
.tools span{border:1px solid var(--line);border-radius:999px;padding:2px 7px;color:var(--dim);font-family:var(--mono);font-size:9px;text-transform:uppercase}
@keyframes spin{to{transform:rotate(360deg)}}

/* Detail page */
.detail{position:fixed;inset:0;z-index:90;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;opacity:0;visibility:hidden;transform:translateY(16px);transition:opacity .3s var(--ease-out),transform .3s var(--ease-out),visibility 0s .3s}
.detail.open{opacity:1;visibility:visible;transform:none;transition:opacity .3s var(--ease-out),transform .3s var(--ease-out)}
.d-in{max-width:660px;margin:0 auto;padding:88px 24px 140px;position:relative}
.back{position:absolute;left:-150px;top:92px;color:var(--dim);display:inline-flex;gap:6px;align-items:center;font-size:15px}
.back:hover{color:var(--fg)}
.d-head{display:flex;gap:14px;align-items:center}
.d-icon{width:44px;height:44px;border-radius:12px;background:var(--pc);display:grid;place-items:center;color:#111}
.d-icon svg{width:22px;height:22px}
.d-head h1{font-size:20px;font-weight:500;line-height:1.2}
.d-head .k{color:var(--dim);font-size:15px}
.d-tags{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0}
.d-tags span{background:var(--bg-2);border-radius:6px;padding:4px 10px;font-size:13px;color:var(--muted)}
.d-p{color:var(--muted);font-size:17px;line-height:1.7}
.d-p+.d-p{margin-top:16px}
.d-p b{color:var(--fg);font-weight:500}
.shot{position:relative;margin:64px 0 24px;border:1px solid var(--line-2);border-radius:12px;background:var(--bg-2);aspect-ratio:16/11;box-shadow:var(--shadow)}
.shot.l{transform:rotate(-1.6deg);margin-right:60px}
.shot.r{transform:rotate(1.4deg);margin-left:60px}
.shot .mock-wrap{position:absolute;inset:0}
.shot .phone{height:86%}
.clip{position:absolute;top:-34px;left:50%;width:44px;height:58px;transform:translateX(-50%);z-index:3;color:var(--fg)}
.cap{position:absolute;font-family:var(--hand);font-size:24px;color:var(--accent);white-space:nowrap;display:flex;align-items:center;gap:6px}
.cap svg{width:40px;height:24px}
.shot.l .cap{right:-150px;top:30%}
.shot.r .cap{left:-150px;top:60%;flex-direction:row-reverse}
.flow{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;padding:24px;flex-wrap:wrap}
.flow .n{border:1.5px dashed var(--line-2);border-radius:10px;padding:12px 14px;font-family:var(--hand);font-size:20px;color:var(--fg);background:var(--card)}
.flow .ar{font-family:var(--hand);font-size:22px;color:var(--dim)}
.d-h3{font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:56px 0 12px}
.d-next{display:flex;justify-content:space-between;align-items:center;margin-top:72px;padding-top:24px;border-top:1px solid var(--line)}
.d-next a{font-size:18px;font-weight:500}
.d-next a:hover{color:var(--accent)}

/* About */
.about{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:56px;align-items:start}
.portrait{position:relative;aspect-ratio:1;border:1px solid var(--line);background:var(--bg-2);border-radius:4px}
.portrait canvas{position:absolute;inset:0;width:100%;height:100%}
.portrait-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1);transition:transform .6s var(--ease-out)}
.portrait:hover .portrait-photo{transform:scale(1.03)}
.portrait{overflow:hidden;background:#000;border-color:var(--line)}
.redframe{position:absolute;inset:11%;border:7px solid #ff2a2a;opacity:0;transform:scale(1.12);transition:opacity .25s,transform .45s var(--spring);pointer-events:none}
.portrait:hover .redframe{opacity:1;transform:scale(1)}
.fig{margin-top:10px;display:flex;justify-content:space-between;color:var(--dim)}
.about-copy p{color:var(--muted);font-size:17px;line-height:1.7}
.about-copy p+p{margin-top:16px}
.about-copy b{color:var(--fg);font-weight:500}
/* About + experience */
.about2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:64px;align-items:start}
.about2 .h2{margin-bottom:16px}
.lede{color:var(--muted);font-size:17px;line-height:1.65;max-width:34ch}
.about2 .loc-card{margin-top:28px}
.xp{list-style:none;border-top:1px solid var(--line)}
.xp li{border-bottom:1px solid var(--line)}
.xp-row{display:grid;grid-template-columns:minmax(0,1fr) 120px 78px 16px;gap:18px;align-items:center;width:100%;padding:18px 8px;text-align:left;color:inherit;cursor:pointer;border-radius:8px;transition-property:background-color;transition-duration:.15s;transition-timing-function:ease-out}
.xp-row:hover{background:var(--bg-2)}
.xp-co b{display:flex;align-items:center;gap:10px;font-weight:500;font-size:17px;line-height:1.3}
.xp-co small{display:block;margin-top:4px;color:var(--dim)}
.xp-now{display:inline-flex;align-items:center;gap:6px;font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.xp-bar{height:4px;border-radius:2px;background:var(--line)}
.xp-bar i{display:block;height:100%;width:calc(var(--p) * 100%);border-radius:2px;background:var(--fg);opacity:.75}
.xp-bar--none{background:repeating-linear-gradient(90deg,var(--line-2) 0 4px,transparent 4px 8px)}
.xp-len{font:500 12px/1 var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.xp-ic{width:16px;height:16px;color:var(--dim);transition-property:transform;transition-duration:.25s;transition-timing-function:var(--ease-out)}
.xp li.open .xp-ic{transform:rotate(180deg)}
.xp-more{display:grid;grid-template-rows:0fr;transition-property:grid-template-rows;transition-duration:.3s;transition-timing-function:var(--ease-out)}
.xp li.open .xp-more{grid-template-rows:1fr}
.xp-more>div{overflow:hidden}
.xp-more p{padding:0 8px 18px;color:var(--muted);font-size:15px;line-height:1.6;max-width:52ch}
@media (max-width:760px){
  .about2{grid-template-columns:1fr;gap:36px}
  .xp-row{grid-template-columns:minmax(0,1fr) auto 16px;padding:16px 4px}
  .xp-bar{display:none}
}
.loc-card{margin-top:36px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.loc-card .loc{border:1px solid var(--line);padding:8px 12px}
.loc-card .tip{left:0;right:auto}

/* Life */
.life{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:40px;align-items:start}
.love{list-style:none;display:grid;gap:4px}
.love li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);color:var(--muted);font-size:16px}
.love li b{color:var(--fg);font-weight:500}
.love li .n{font-family:var(--mono);font-size:11px;color:var(--dim);padding-top:4px;flex:none;width:20px}
.board{position:relative;height:520px}
.pol{position:absolute;width:158px;background:#f4f1ea;padding:8px 8px 34px;box-shadow:0 10px 26px rgba(0,0,0,.35);transform:rotate(var(--r));cursor:grab;touch-action:none;user-select:none;transition:box-shadow .2s;color:#222}
.pol:active{cursor:grabbing;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.pol .img{aspect-ratio:1;position:relative;overflow:hidden;background:var(--g)}
.pol .img::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.35) 1px,transparent 1.3px);background-size:4px 4px;mix-blend-mode:multiply}
.pol .c{position:absolute;left:10px;bottom:6px;font-family:var(--hand);font-size:20px;line-height:1}
.board-note{position:absolute;right:0;bottom:-6px;font-family:var(--hand);font-size:20px;color:var(--dim)}

.pile-box{margin-top:96px}
.pile-wrap{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:56px;align-items:end;margin-top:28px}
.pile{position:relative;height:var(--ph,320px);padding-bottom:14px}
.pile::after{content:"";position:absolute;left:-24px;right:-24px;bottom:0;height:14px;border-radius:3px;background:linear-gradient(#cfb48a,#a8875a);box-shadow:0 10px 20px rgba(0,0,0,.25)}
.bkf{position:absolute;left:var(--x);bottom:var(--y);width:var(--w);height:var(--h);background:var(--c);color:var(--t);border-radius:3px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;font-size:12px;font-weight:500;text-align:left;transform:rotate(var(--r));box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -2px 0 rgba(0,0,0,.18),0 2px 3px rgba(0,0,0,.18);transition-property:transform,box-shadow;transition-duration:.35s;transition-timing-function:var(--ease-out);z-index:1}
.bkf span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bkf small{font-family:var(--mono);font-size:9px;opacity:.7;flex:none}
.bkf:hover{transform:rotate(var(--r)) translateX(10px)}
.bkf[aria-pressed="true"]{transform:rotate(0deg) translateX(46px);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -2px 0 rgba(0,0,0,.18),0 10px 22px rgba(0,0,0,.3);z-index:2}
.bkf .rib{position:absolute;right:38px;top:100%;width:8px;height:22px;background:#d7263d;clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
.pile-note{border-left:1px solid var(--line-2);padding:4px 0 18px 28px;min-height:200px}
.pile-note h4{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3.4vw,40px);line-height:1.05;margin:10px 0 6px}
.pile-note .by{color:var(--dim)}
.pile-note p{color:var(--muted);font-size:17px;line-height:1.65;margin-top:16px;max-width:34ch}
.pile-note .tagr{display:inline-block;margin-top:16px;color:#d7263d}
.pile-note.swap{animation:chIn .35s var(--ease-out)}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.boxed{border:1px solid var(--line);border-radius:6px;background:var(--bg);overflow:hidden;position:relative}
.boxed-h{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--dim)}
.player{display:flex;gap:24px;align-items:center;padding:24px}
.deck{position:relative;width:168px;height:168px;flex:none}
.record{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,#0d0d0d 0 1.5px,#1c1c1c 1.5px 3px);box-shadow:0 10px 24px rgba(0,0,0,.4);animation:spin 2.2s linear infinite;animation-play-state:paused}
.record::before{content:"";position:absolute;inset:33%;border-radius:50%;background:var(--accent)}
.record::after{content:"";position:absolute;inset:47%;border-radius:50%;background:var(--bg)}
.record i{position:absolute;inset:38%;border-radius:50%;background-image:radial-gradient(rgba(0,0,0,.35) 1px,transparent 1.3px);background-size:4px 4px;z-index:1}
.playing .record{animation-play-state:running}
.arm{position:absolute;right:-10px;top:-6px;width:12px;height:100px;transform-origin:50% 8px;transform:rotate(-8deg);transition:transform .6s var(--ease-out)}
.arm::before{content:"";position:absolute;left:3px;top:0;width:6px;height:90px;border-radius:3px;background:linear-gradient(#cfcfcf,#9a9a9a)}
.arm::after{content:"";position:absolute;left:0;bottom:0;width:12px;height:16px;border-radius:3px;background:#555}
.playing .arm{transform:rotate(18deg)}
.p-info{min-width:0}
.p-info h4{font-size:18px;font-weight:500;margin:6px 0 2px}
.p-info p{color:var(--muted);font-size:14px}
.eq{display:flex;gap:3px;height:18px;align-items:flex-end;margin:14px 0}
.eq i{width:4px;height:4px;border-radius:1px;background:var(--fg);opacity:.6}
.playing .eq i{animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}.eq i:nth-child(5){animation-delay:.6s}
@keyframes eq{0%,100%{height:4px}50%{height:18px}}
.sea{position:relative;height:260px;cursor:pointer}
.sea canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.gh{margin-top:20px}
.gh-b{padding:16px;overflow-x:auto}
.gh-grid{display:grid;grid-template-rows:repeat(7,10px);grid-auto-flow:column;grid-auto-columns:10px;gap:3px;min-width:680px}
.gh-grid i{border-radius:2px;background:var(--line)}
.gh-grid i.l1{background:rgba(74,222,128,.35)}.gh-grid i.l2{background:rgba(74,222,128,.6)}.gh-grid i.l3{background:#4ade80}
.gh-f{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:var(--muted);gap:12px;flex-wrap:wrap;min-width:680px}

/* Contact & footer */
.garden{display:block;width:100%;height:130px;margin-top:8px}
.flower{cursor:pointer}
.flower *{fill:transparent;stroke:var(--dim);stroke-width:1;transition:fill .6s,stroke .6s}
.flower:hover *{stroke:var(--fg)}
.flower.bloom .pt{fill:var(--c);stroke:var(--c)}
.flower.bloom .ct{fill:#f5c84c;stroke:#d6a520}
.flower.bloom .lf{fill:#3f9a55;stroke:#2f7a41}
.flower.bloom .st{stroke:#3f9a55}
.flower .hd{transform-box:fill-box;transform-origin:center}
.flower.bloom .hd{animation:pop .7s var(--spring)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.garden-note{display:flex;justify-content:space-between;color:var(--dim);margin-top:6px}
.contact{padding-top:64px}
.contact h2{font-size:clamp(34px,5.4vw,60px);font-weight:500;letter-spacing:-.03em;line-height:1.05;max-width:16ch}
.contact .sub{font-size:18px}
.socials{display:flex;gap:18px;flex-wrap:wrap;margin-top:28px}
.socials a{color:var(--muted);transition:color .15s}
.socials a:hover{color:var(--fg)}
.tblock{margin-top:72px;display:grid;grid-template-columns:2fr 2fr 1fr 2fr 1fr 1fr;border:1px solid var(--line-2)}
.tblock>div,.tblock>button{border-right:1px solid var(--line-2);padding:10px 12px;text-align:left;min-width:0}
.tblock>:last-child{border-right:0}
.tblock small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.tblock b{display:block;font-weight:500;font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tblock button:hover{background:var(--bg-2)}
.wm{display:flex;gap:var(--c);margin:72px 0 0;--c:min(22px,calc((100vw - 80px)/42))}
.lt{display:grid;grid-auto-rows:var(--c);gap:0}
.px{width:var(--c);height:var(--c);transition:background-color .6s}
.px.on{background:var(--fg)}
.lt.f2 .px.on{background:linear-gradient(90deg,var(--fg),rgba(var(--dither),.25))}
.lt.o .px.on{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}
.px.on:hover{background:var(--accent)!important;transition:none}
footer.bot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:24px 0 40px;margin-top:28px;border-top:1px solid var(--line);color:var(--dim)}

/* Toast, help, inspect, cat */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,24px);background:#111;color:#f5f5f5;border:1px solid rgba(255,255,255,.12);padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s var(--ease-out);z-index:120;max-width:calc(100vw - 40px);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.help{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.help.open{opacity:1;visibility:visible;transition:opacity .2s}
.help-c{width:min(440px,100%);background:var(--card);border:1px solid var(--line-2);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.help-c h3{font-size:18px;font-weight:500;margin-bottom:4px}
.help-c ul{list-style:none;margin-top:16px;display:grid;gap:2px}
.help-c li{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.help-c li:last-child{border-bottom:0}
.help-c li span:last-child{display:flex;gap:4px;flex:none}
#inspect{position:fixed;z-index:100;pointer-events:none;display:none}
html.inspect #inspect{display:block}
#inspect .bx{position:fixed;border:1px solid var(--blue);background:rgba(13,153,255,.06)}
#inspect .pd{position:absolute;background:rgba(74,222,128,.18)}
#inspect .lb{position:fixed;background:var(--blue);color:#fff;font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:3px;white-space:nowrap}
.inspect-pill{position:fixed;top:34px;left:50%;transform:translateX(-50%);z-index:101;background:var(--blue);color:#fff;font-family:var(--mono);font-size:11px;padding:6px 12px;border-radius:999px;display:none;letter-spacing:.04em}
html.inspect .inspect-pill{display:block}
#cat{position:fixed;left:0;top:0;width:48px;height:36px;z-index:95;pointer-events:none;display:none}
#cat.on{display:block}
#cat svg{width:48px;height:36px;overflow:visible}
#cat .fill{fill:#fafafa;stroke:#111;stroke-width:1.4;stroke-linejoin:round}
#cat .lg{transform-box:fill-box;transform-origin:50% 0}
#cat.run .l1,#cat.run .l3{animation:legA .32s linear infinite}
#cat.run .l2,#cat.run .l4{animation:legB .32s linear infinite}
#cat.run .bodyg{animation:bob .32s ease-in-out infinite}
#cat.sit .lg{transform:scaleY(.55)}
#cat.sit .bodyg,#cat.sleep .bodyg{transform:translateY(3px)}
#cat .closed{display:none}
#cat.sleep .eyes{display:none}
#cat.sleep .closed{display:block}
#cat.sleep .lg{transform:scaleY(.4)}
#cat .zz{display:none;font-family:var(--mono);font-size:9px;fill:var(--fg)}
#cat.sleep .zz{display:block;animation:zz 2s ease-in-out infinite}
@keyframes legA{0%,100%{transform:rotate(28deg)}50%{transform:rotate(-28deg)}}
@keyframes legB{0%,100%{transform:rotate(-28deg)}50%{transform:rotate(28deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes zz{0%{opacity:0;transform:translate(0,4px)}50%{opacity:1}100%{opacity:0;transform:translate(6px,-8px)}}

/* Gear 5 */
html.gear5,html.gear5 *{cursor:var(--hat-cursor,auto)!important}
html.gear5 :is(.cover,.btn,.dial,.pol,.spine,.tile,.rot,.icon-btn,.tag,.bk):hover{animation:rubber .75s both}
html.gear5 .wv span:not(.bal){animation:hop 1s ease-in-out infinite;animation-delay:calc(var(--i) * 70ms)}
html.gear5 .hero::after{content:"GEAR 5";position:absolute;right:0;bottom:30px;font-family:var(--mono);font-size:12px;letter-spacing:.3em;color:var(--accent);border:1px solid var(--accent);padding:4px 10px;border-radius:999px;animation:hop 1.2s ease-in-out infinite}
@keyframes rubber{0%{transform:scale(1)}30%{transform:scale(1.18,.82)}40%{transform:scale(.84,1.16)}50%{transform:scale(1.1,.9)}65%{transform:scale(.96,1.04)}75%{transform:scale(1.03,.97)}100%{transform:scale(1)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-7px) scale(1.06,.94)}60%{transform:translateY(0) scale(.94,1.06)}}

/* Responsive */
@media (max-width:1180px){.back{position:static;margin-bottom:28px}.shot{margin-left:0!important;margin-right:0!important;margin-bottom:56px}.shot.l .cap,.shot.r .cap{top:auto;bottom:-40px;left:auto;right:8px;flex-direction:row;font-size:21px}}
@media (max-width:980px){
  body{padding:0}
  .ruler{display:none}
  nav.top{top:0}
  .page{border-left:0;border-right:0;padding:0 20px}
  nav.top{margin:0 -20px;padding:12px 20px}
  .sec::before,.sec::after{display:none}
  .nav-links{display:none}
  .hero{padding:72px 0 80px;min-height:0}
  .hero-dither{left:-20px;width:calc(100% + 40px)}
  .h1wrap{display:block}

  hold: '<button class="hold" id="hold"><span>Hold to delete</span></button><span class="hint mono dim" id="holdHint">Press and hold</span>',
  copy: '<button class="copy" id="copy" aria-label="Copy the command">npx hire-karthik<i><svg class="cp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i></button>'
};
const media = v => {
  if (v.type === 'image') return `<img src="${v.src}" alt="${v.title}" loading="lazy">`;
  if (v.type === 'video') return `<video src="${v.src}" muted loop playsinline preload="metadata" aria-label="${v.title}"></video>`;
  if (v.type === 'mock') return `<div class="mock-wrap" style="--pc:${P(v.project).pc}">${mockHTML(P(v.project))}</div>`;
  return LIVE[v.live];
};

// Build the grid
const vz = $('#vz');
VISUALS.forEach((v, i) => {
  const el = document.createElement('figure'); el.className = 'vt'; el.dataset.tags = v.tags.join('|');
  const rgb = v.project ? P(v.project).rgb : '255,75,62';
  el.innerHTML = `<div class="vt-m${v.type === 'live' ? ' vt-live' : ''}" style="--ar:${v.ar || '4/3'};--rgb:${rgb}">${media(v)}${v.type !== 'live' ? `<button class="vt-open" data-i="${i}" aria-label="Open ${v.title}"></button>` : ''}</div>
    <figcaption class="vt-c"><b>${v.title}</b><span class="mono">${v.type === 'live' ? '<span class="live-badge">Live</span>' : v.tags[0]}</span></figcaption>`;
  vz.appendChild(el);
  const vid = $('video', el);
  if (vid && !reduce) { el.addEventListener('mouseenter', () => vid.play().catch(() => {})); el.addEventListener('mouseleave', () => vid.pause()); }
});

// Filters
const FILTERS = ['All', 'Mobile', 'Web', 'Components', 'Interactions'];
const bar = $('#vbar'), count = $('#vcount');
FILTERS.forEach(f => {
  const n = f === 'All' ? VISUALS.length : VISUALS.filter(v => v.tags.includes(f)).length;
  const b = document.createElement('button'); b.className = 'fchip'; b.setAttribute('aria-pressed', f === 'All');
  b.innerHTML = `${f}<small>${n}</small>`;
  b.addEventListener('click', () => {
    $$('.fchip', bar).forEach(x => x.setAttribute('aria-pressed', x === b));
    let shown = 0; $$('.vt', vz).forEach(t => { const on = f === 'All' || t.dataset.tags.split('|').includes(f); t.hidden = !on; if (on) shown++; });
    count.textContent = `${shown} ${shown === 1 ? 'piece' : 'pieces'}`;
  });
  bar.insertBefore(b, count);
});
count.textContent = `${VISUALS.length} pieces`;

// Lightbox
const lb = $('#lb'); let cur = -1;
const openable = () => VISUALS.map((v, i) => i).filter(i => VISUALS[i].type !== 'live' && !$$('.vt', vz)[i].hidden);
const show = i => {
  cur = i; const v = VISUALS[i];
  $('#lbM').innerHTML = v.type === 'video' ? `<video src="${v.src}" controls autoplay muted loop playsinline></video>` : media(v);
  $('#lbT').textContent = v.title; $('#lbD').textContent = v.desc || '';
};
const step = d => { const list = openable(); if (!list.length) return; const k = list.indexOf(cur); show(list[(k + d + list.length) % list.length]); };
vz.addEventListener('click', e => { const b = e.target.closest('.vt-open'); if (!b) return; show(+b.dataset.i); lb.showModal(); });
$('#lbPrev').addEventListener('click', () => step(-1));
$('#lbNext').addEventListener('click', () => step(1));
$('#lbX').addEventListener('click', () => lb.close());
lb.addEventListener('click', e => { if (e.target === lb) lb.close(); });
lb.addEventListener('keydown', e => { if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); });
lb.addEventListener('close', () => { $('#lbM').innerHTML = ''; });

/* ---------------- Playground ---------------- */
safe('shimmer', () => {
  const el = $('#shim'); const ph = ['Product designer', 'Ex mechanical engineer', 'Straw hat enthusiast', 'Pixel pusher', 'Chai-powered'];
  let i = 0; setInterval(() => { if (document.hidden) return; el.classList.add('out'); setTimeout(() => { i = (i + 1) % ph.length; el.textContent = ph[i]; el.classList.remove('out'); }, 300); }, 2600);
});
safe('toggle', () => {
  const t = $('#tgl'); const btns = $$('button', t);
  btns.forEach(b => b.addEventListener('click', () => { const p = b.dataset.v === '1'; t.classList.toggle('prem', p); btns.forEach(x => x.setAttribute('aria-pressed', x === b)); $('#tglNote').textContent = p ? 'Upgraded. Feel that bounce?' : 'Spring: stiffness 1.56'; }));
});
safe('led', () => {
  const cv = $('#led'), inp = $('#ledIn'); const ctx = cv.getContext('2d'); const off = document.createElement('canvas'); const oc = off.getContext('2d');
  let bits = [], tw = 0, off2 = 0, visible = true;
  const build = () => {
    const txt = (inp.value || ' ').toUpperCase() + '   ';
    oc.font = 'bold 9px monospace'; tw = Math.ceil(oc.measureText(txt).width); off.width = tw; off.height = 9;
    oc.font = 'bold 9px monospace'; oc.fillStyle = '#fff'; oc.textBaseline = 'top'; oc.fillText(txt, 0, 0);
    const d = oc.getImageData(0, 0, tw, 9).data; bits = [];
    for (let y = 0; y < 9; y++) { bits[y] = []; for (let x = 0; x < tw; x++) bits[y][x] = d[(y * tw + x) * 4 + 3] > 110; }
  };
  const size = () => { const r = cv.getBoundingClientRect(); const dpr = Math.min(devicePixelRatio || 1, 2); cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  const draw = () => {
    const w = cv.width / (Math.min(devicePixelRatio || 1, 2)), h = cv.height / (Math.min(devicePixelRatio || 1, 2));
    const pitch = h / 11; const cols = Math.floor(w / pitch); const r = pitch * .36; const y0 = pitch;
    ctx.clearRect(0, 0, w, h);
    for (let c = 0; c < cols; c++) {
      const sx = Math.floor((c + off2) % (tw + cols)) - cols + Math.floor(cols * .0);
      const tx = sx;
      for (let y = 0; y < 9; y++) {
        const on = tx >= 0 && tx < tw && bits[y][tx];
        ctx.fillStyle = on ? '#ffb547' : 'rgba(255,181,71,.09)';
        ctx.beginPath(); ctx.arc(c * pitch + pitch / 2, y0 + y * pitch + pitch / 2, r, 0, Math.PI * 2); ctx.fill();
      }
    }
  };
  const loop = () => { if (visible && !document.hidden) { off2 += .18; draw(); } requestAnimationFrame(loop); };
  build(); size(); draw();
  inp.addEventListener('input', () => { build(); off2 = 0; });
  addEventListener('resize', () => { size(); draw(); });
  if ('IntersectionObserver' in window) new IntersectionObserver(es => es.forEach(e => visible = e.isIntersecting)).observe(cv);
  if (!reduce) requestAnimationFrame(loop); else { off2 = 0; draw(); }
});


safe('hold', () => {
  const b = $('#hold'), hint = $('#holdHint'), label = $('span', b); let t;
  const reset = () => { b.classList.remove('on'); clearTimeout(t); };
  b.addEventListener('pointerdown', e => {
    if (b.classList.contains('done')) return; b.setPointerCapture(e.pointerId); b.classList.add('on'); hint.textContent = 'Keep holding…';
    t = setTimeout(() => { b.classList.remove('on'); b.classList.add('done'); label.textContent = 'Deleted'; hint.textContent = 'Resets in a moment';
      setTimeout(() => { b.classList.remove('done'); label.textContent = 'Hold to delete'; hint.textContent = 'Press and hold'; }, 1800); }, 1400);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, () => { if (!b.classList.contains('done')) { reset(); hint.textContent = 'Press and hold'; } }));
});
safe('copy', () => {
  const b = $('#copy'); let t;
  b.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText('npx hire-karthik'); } catch (e) {}
    b.classList.add('ok'); clearTimeout(t); t = setTimeout(() => b.classList.remove('ok'), 1600);
  });
});
})();
</script>

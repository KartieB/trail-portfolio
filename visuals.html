<script>
(() => {
  const t = document.getElementById('time');
  const fmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: false });
  const tick = () => { t.textContent = fmt.format(new Date()); };
  tick(); setInterval(tick, 30000);
  // keyboard: G then P opens Photos
  let gAt = 0;
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea|select/i.test(e.target.tagName)) return;
    const k = e.key.toLowerCase();
    if (k === 'g') { gAt = Date.now(); return; }
    if (Date.now() - gAt > 1200) return;
    gAt = 0;
    if (k === 'p') location.href = 'visuals.html';
  });


  // placeholder cards until real work is added: fixed 300px width, varied heights
  const store = document.getElementById('store');
  const H = [380, 240, 340, 300, 420, 260, 360, 300, 240, 400, 320, 280, 380, 260, 340, 300, 420, 240, 360];
  const CATS = ['mobile', 'product', 'saas', 'interactions'];
  H.forEach((h, i) => {
    const c = document.createElement('div');
    c.className = 'card'; c.style.setProperty('--h', h + 'px');
    c.dataset.cat = CATS[i % CATS.length];
    c.setAttribute('aria-hidden', 'true');
    const im = new Image(); im.alt = ''; im.loading = 'lazy'; im.decoding = 'async'; im.width = 600; im.height = h * 2;
    im.src = `https://picsum.photos/seed/kb-visual-${i + 1}/600/${h * 2}`;
    c.appendChild(im);
    store.appendChild(c);
  });
  const cards = [...store.children];
  const grid = document.getElementById('grid'), wrap = document.getElementById('wrap');
  let filter = 'all', cols = 0;
  const layout = force => {
    const cw = 300, gap = 12;
    const vw = Math.min(innerWidth, document.documentElement.clientWidth, window.visualViewport ? visualViewport.width : innerWidth);
    const n = Math.max(1, Math.min(4, Math.floor((vw - 40 + gap) / (cw + gap))));
    if (n === cols && !force) return;
    cols = n;
    wrap.style.setProperty('--w', (n * cw + (n - 1) * gap) + 'px');
    const columns = Array.from({ length: n }, () => { const d = document.createElement('div'); d.className = 'col'; return d; });
    const heights = new Array(n).fill(0);
    cards.forEach(c => store.appendChild(c));
    cards.filter(c => filter === 'all' || c.dataset.cat.split(' ').includes(filter)).forEach(c => {
      const k = heights.indexOf(Math.min(...heights));
      columns[k].appendChild(c);
      heights[k] += parseInt(c.style.getPropertyValue('--h')) + gap;
    });
    grid.replaceChildren(...columns);
  };
  document.querySelectorAll('.pill').forEach(p => p.addEventListener('click', () => {
    filter = p.dataset.f;
    document.querySelectorAll('.pill').forEach(b => b.setAttribute('aria-pressed', b === p));
    layout(true);
  }));
  addEventListener('resize', () => layout(false));
  // hide the right-edge fade once the filter row is scrolled to its end
  const fw = document.querySelector('.filters-wrap'), fr = fw.querySelector('.filters');
  const edge = () => fw.classList.toggle('end', fr.scrollLeft + fr.clientWidth >= fr.scrollWidth - 2);
  fr.addEventListener('scroll', edge, { passive: true }); addEventListener('resize', edge); edge();
  layout(true);
  // My setup: the card grows out of the nav button; the big icon leans toward the cursor and swaps to the tool you point at
  {
    const ab = document.getElementById('ab'), btn = document.getElementById('abOpen');
    const card = ab.querySelector('.ab-card'), icon = ab.querySelector('.ab-icon'), art = ab.querySelector('.ab-art');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const open = () => {
      const b = btn.getBoundingClientRect();
      ab.hidden = false; document.body.classList.add('ab-on');
      const c = card.getBoundingClientRect();
      card.style.setProperty('--ox', (b.left + b.width / 2 - (c.left + c.width / 2)) + 'px');
      card.style.setProperty('--oy', (b.top + b.height / 2 - (c.top + c.height / 2)) + 'px');
      card.style.transformOrigin = '50% 50%';
      card.getBoundingClientRect();
      ab.classList.add('open');
      ab.querySelector('.ab-x').focus({ preventScroll: true });
    };
    const close = () => {
      if (ab.hidden) return;
      ab.classList.remove('open');
      setTimeout(() => { ab.hidden = true; document.body.classList.remove('ab-on'); btn.focus({ preventScroll: true }); }, reduce ? 0 : 320);
    };
    btn.addEventListener('click', open);
    ab.querySelectorAll('[data-close]').forEach(n => n.addEventListener('click', close));
    addEventListener('keydown', e => { if (e.key === 'Escape' && !ab.hidden) close(); });
    // keep Tab inside the card
    card.addEventListener('keydown', e => {
      if (e.key !== 'Tab') return;
      const f = [...card.querySelectorAll('button')], first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
    if (!reduce) {
      art.addEventListener('pointermove', e => {
        const r = art.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
        icon.style.setProperty('--ry', (x * 22) + 'deg'); icon.style.setProperty('--rx', (-y * 22) + 'deg');
        icon.style.setProperty('--tx', (x * 10) + 'px'); icon.style.setProperty('--ty', (y * 8) + 'px');
      });
      art.addEventListener('pointerleave', () => ['--rx', '--ry', '--tx', '--ty'].forEach(p => icon.style.removeProperty(p)));
    }
    // pointing at a tool swaps the big icon and the note
    const note = ab.querySelector('.su-note'), big = icon.querySelector('.su-ic'), tiles = [...ab.querySelectorAll('.su-t')];
    const pick = t => {
      if (t.classList.contains('on')) return;
      tiles.forEach(x => x.classList.toggle('on', x === t));
      big.innerHTML = t.querySelector('.su-ic').innerHTML;
      icon.classList.remove('pop', 'glow'); icon.getBoundingClientRect(); icon.classList.add('pop', 'glow');
      note.classList.add('swap'); setTimeout(() => { note.textContent = t.dataset.note; note.classList.remove('swap'); }, reduce ? 0 : 150);
    };
    tiles.forEach(t => { t.addEventListener('mouseenter', () => pick(t)); t.addEventListener('focus', () => pick(t)); t.addEventListener('click', () => pick(t)); });
    tiles[0].classList.add('on');
  }

  // Sound, theme and motion preferences. Sounds are tiny synthesized clicks (no files), only after the first tap.
  {
    const root = document.documentElement, store = (k, v) => { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
    const read = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
    let soundOn = read('sound') !== 'off', ac = null;
    const blip = (f1, f2, dur, vol = .05, type = 'sine', at = 0) => {
      if (!soundOn) return;
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .004); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
    };
    const SND = {
      tap: () => { blip(1200, 700, .06, .16, 'triangle'); blip(2400, 1800, .02, .05, 'sine'); },
      open: () => { blip(520, 700, .09, .16); blip(700, 940, .1, .12, 'sine', .06); },
      close: () => { blip(760, 560, .09, .14); blip(560, 420, .1, .1, 'sine', .055); },
      on: () => { blip(660, 660, .08, .14, 'triangle'); blip(990, 990, .1, .12, 'triangle', .07); },
      off: () => { blip(990, 990, .08, .12, 'triangle'); blip(660, 660, .1, .1, 'triangle', .07); },
      pick: () => blip(300, 560, .08, .18, 'sine'),
    };
    const play = n => (SND[n] || SND.tap)();
    window.kbPlay = play;
    const wake = () => { if (!soundOn) return; ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); };
    addEventListener('pointerdown', wake, { capture: true, passive: true }); addEventListener('keydown', wake, { capture: true });
    document.addEventListener('click', e => {
      const el = e.target.closest('a,button,[role="switch"],summary,label');
      if (!el) return;
      const n = el.dataset.snd || 'tap';
      // links to another page: let the click sound play before leaving
      if (soundOn && el.tagName === 'A' && el.origin === location.origin && el.pathname !== location.pathname && !el.target && !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.defaultPrevented) {
        e.preventDefault(); play(n); setTimeout(() => { location.href = el.href; }, 140); return;
      }
      if (n === 'toggle') setTimeout(() => play(el.getAttribute('aria-checked') === 'true' || (el.id === 'themeT' && root.dataset.theme === 'dark') ? 'on' : 'off'), 0);
      else play(n);
    }, true);
    document.querySelectorAll('.lv-obj').forEach(o => o.addEventListener('pointerdown', () => play('pick')));

    // theme: light, dark or auto; the header icon flips between light and dark
    const sys = matchMedia('(prefers-color-scheme: dark)');
    const tb = document.getElementById('themeT'), seg = [...document.querySelectorAll('[data-theme-set]')];
    let mode = read('theme') || 'auto';
    const resolve = m => m === 'auto' ? (sys.matches ? 'dark' : 'light') : m;
    const sync = () => {
      tb.setAttribute('aria-checked', root.dataset.theme === 'dark');
      seg.forEach(b => b.setAttribute('aria-checked', b.dataset.themeSet === mode));
    };
    const setTheme = (m, from) => {
      mode = m; store('theme', m === 'auto' ? undefined : m);
      const next = resolve(m);
      if (next === root.dataset.theme) return sync();
      const apply = () => { root.dataset.theme = next; sync(); };
      if (!from || !document.startViewTransition || root.dataset.motion === 'reduce' || matchMedia('(prefers-reduced-motion: reduce)').matches) return apply();
      const r = from.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
      const end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
      document.startViewTransition(apply).ready.then(() => {
        root.animate({ clipPath: [`circle(0 at ${x}px ${y}px)`, `circle(${end}px at ${x}px ${y}px)`] },
          { duration: 550, easing: 'cubic-bezier(.4,0,.2,1)', pseudoElement: '::view-transition-new(root)' });
      });
    };
    sync();
    tb.addEventListener('click', () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark', tb));
    seg.forEach(b => b.addEventListener('click', () => setTheme(b.dataset.themeSet, b)));
    sys.addEventListener('change', () => { if (mode === 'auto') setTheme('auto'); });

    // panel
    const pr = document.getElementById('pr'), po = document.getElementById('prOpen');
    const snd = document.getElementById('prSound'), mot = document.getElementById('prMotion');
    snd.setAttribute('aria-checked', soundOn); mot.setAttribute('aria-checked', root.dataset.motion === 'reduce');
    snd.addEventListener('click', () => { soundOn = !soundOn; snd.setAttribute('aria-checked', soundOn); store('sound', soundOn ? undefined : 'off'); if (soundOn) play('on'); });
    mot.addEventListener('click', () => {
      const on = root.dataset.motion !== 'reduce';
      if (on) root.dataset.motion = 'reduce'; else delete root.dataset.motion;
      mot.setAttribute('aria-checked', on); store('motion', on ? 'reduce' : undefined);
    });
    const setOpen = on => {
      po.setAttribute('aria-expanded', on);
      if (on) { pr.hidden = false; pr.getBoundingClientRect(); pr.classList.add('open'); (pr.querySelector('[aria-checked="true"]') || pr.querySelector('button')).focus({ preventScroll: true }); }
      else if (!pr.hidden) { pr.classList.remove('open'); setTimeout(() => { if (!pr.classList.contains('open')) pr.hidden = true; }, 250); }
    };
    po.addEventListener('click', () => setOpen(pr.hidden || !pr.classList.contains('open')));
    document.addEventListener('pointerdown', e => { if (!pr.hidden && !e.target.closest('#pr,#prOpen')) { setOpen(false); play('close'); } });
    addEventListener('keydown', e => { if (e.key === 'Escape' && !pr.hidden) { setOpen(false); po.focus(); play('close'); } });
  }

  // photo overlay: the card grows into a large view; arrows or ← → step through what the filter shows
  {
    const lb = document.getElementById('lb'), big = lb.querySelector('.lb-img'), num = lb.querySelector('.lb-n');
    const cap = lb.querySelector('.lb-cap'), ttl = lb.querySelector('.lb-t'), dsc = lb.querySelector('.lb-d');
    const CAT = { mobile: 'Mobile', product: 'Product', saas: 'SaaS', interactions: 'Interactions' };
    const snd = n => window.kbPlay && window.kbPlay(n);
    const still = () => matchMedia('(prefers-reduced-motion: reduce)').matches || document.documentElement.dataset.motion === 'reduce';
    let list = [], at = 0, from = null;
    const visible = () => [...document.querySelectorAll('#grid .card')];
    const fit = im => {
      const r = (im.naturalWidth || im.width) / (im.naturalHeight || im.height) || 1;
      const m = innerWidth < 640, mw = innerWidth - (m ? 32 : 160), mh = innerHeight - (m ? 250 : 200);
      let w = Math.min(mw, mh * r), h = w / r;
      // leave room under the photo for its title and description
      return { left: (innerWidth - w) / 2, top: (innerHeight - h - (m ? 140 : 100)) / 2, width: w, height: h };
    };
    const place = b => {
      Object.assign(big.style, { left: b.left + 'px', top: b.top + 'px', width: b.width + 'px', height: b.height + 'px' });
      const cw = Math.max(b.width, Math.min(360, innerWidth - 32));
      Object.assign(cap.style, { left: (innerWidth - cw) / 2 + 'px', top: b.top + b.height + 12 + 'px', width: cw + 'px' });
    };
    const flip = (a, b, dur) => big.animate([
      { transform: `translate(${a.left - b.left}px,${a.top - b.top}px) scale(${a.width / b.width},${a.height / b.height})`, borderRadius: '16px' },
      { transform: 'none', borderRadius: '14px' }], { duration: dur, easing: 'cubic-bezier(.2,.9,.25,1)' });
    const show = i => {
      at = (i + list.length) % list.length;
      const im = list[at].querySelector('img');
      big.src = im.currentSrc || im.src; big.alt = im.alt;
      num.textContent = `${at + 1} / ${list.length}`;
      const c = list[at], cat = (c.dataset.cat || '').split(' ')[0];
      ttl.textContent = c.dataset.title || `${CAT[cat] || 'Visual'} exploration ${at + 1}`;
      dsc.textContent = c.dataset.desc || 'Placeholder for now. The real screen and its story are coming soon.';
      return im;
    };
    const open = card => {
      list = visible(); from = card;
      const im = show(list.indexOf(card));
      lb.hidden = false; document.body.classList.add('lb-on');
      const end = fit(im); place(end);
      lb.getBoundingClientRect(); lb.classList.add('open');
      if (!still()) flip(card.getBoundingClientRect(), end, 480);
      lb.querySelector('.lb-x').focus({ preventScroll: true });
      snd('open');
    };
    const step = d => {
      if (list.length < 2) return;
      big.classList.add('swap'); cap.classList.add('swap');
      setTimeout(() => {
        const im = show(at + d); from = list[at]; place(fit(im));
        const done = () => { big.classList.remove('swap'); cap.classList.remove('swap'); };
        big.decode ? big.decode().then(done, done) : done();
      }, still() ? 0 : 160);
    };
    const close = () => {
      if (lb.hidden) return;
      lb.classList.remove('open');
      const card = list[at], r = card && card.getBoundingClientRect(), b = big.getBoundingClientRect();
      const done = () => { lb.hidden = true; document.body.classList.remove('lb-on'); if (card) card.focus({ preventScroll: true }); };
      if (!still() && r && r.bottom > 0 && r.top < innerHeight) {
        big.animate([{ transform: 'none' }, { transform: `translate(${r.left - b.left}px,${r.top - b.top}px) scale(${r.width / b.width},${r.height / b.height})`, borderRadius: '16px' }],
          { duration: 360, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' }).finished.then(a => { done(); big.getAnimations().forEach(x => x.cancel()); });
      } else setTimeout(done, still() ? 0 : 250);
    };
    const grid = document.getElementById('grid');
    const ready = () => visible().forEach(c => { c.tabIndex = 0; c.setAttribute('role', 'button'); c.removeAttribute('aria-hidden'); c.setAttribute('aria-label', 'Open photo' + ((c.querySelector('img') || {}).alt ? ': ' + c.querySelector('img').alt : '')); });
    ready(); new MutationObserver(ready).observe(grid, { childList: true, subtree: true });
    grid.addEventListener('click', e => { const c = e.target.closest('.card'); if (c) open(c); });
    grid.addEventListener('keydown', e => { const c = e.target.closest('.card'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); open(c); } });
    lb.querySelectorAll('[data-lb-close]').forEach(n => n.addEventListener('click', () => { if (!n.dataset.snd) snd('close'); close(); }));
    big.addEventListener('click', () => { snd('close'); close(); });
    lb.querySelector('.lb-prev').addEventListener('click', () => step(-1));
    lb.querySelector('.lb-next').addEventListener('click', () => step(1));
    addEventListener('keydown', e => {
      if (lb.hidden) return;
      if (e.key === 'Escape') { snd('close'); close(); }
      else if (e.key === 'ArrowRight') { snd('tap'); step(1); }
      else if (e.key === 'ArrowLeft') { snd('tap'); step(-1); }
    });
    addEventListener('resize', () => { if (!lb.hidden) place(fit(list[at].querySelector('img'))); });
    // swipe on phones
    let sx = null;
    lb.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
    lb.addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 50) { snd('tap'); step(dx < 0 ? 1 : -1); } });
  }

})();
</script>
</body>
</html>
